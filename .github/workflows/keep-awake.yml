name: Keep app awake

on:
  schedule:
    - cron: "0 */6 * * *"   # ogni 6 ore (Streamlit addormenta dopo ~12 ore)
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scripts/keep_awake.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot
          path: keep_awake_failed.png
          if-no-files-found: ignore
